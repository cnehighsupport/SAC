 if(t==='new')sideNew();else sideUse();}

function sideNew(){let h='',cur=null;X.new.forEach((s,i)=>{if(s.b!==cur){cur=s.b;h+='<h4>'+esc(cur)+'</h4>';}h+='<a href="#" data-i="'+i+'">'+(i+1)+'. '+esc(s.n)+'<small>'+esc(s.t)+'</small></a>';});
 $('#side').innerHTML=h;$('#side').querySelectorAll('a').forEach(a=>a.onclick=ev=>{ev.preventDefault();showNew(+a.dataset.i);});showNew(CUR.new);}
function showNew(i){CUR.new=i;const s=X.new[i];mark(i);
 $('#main').innerHTML='<article class="doc"><h2>'+(i+1)+'. '+esc(s.n)+'</h2><div class="tag">'+esc(s.b)+' · 대면 심의 '+esc(s.t)+' · 신청 '+s.k+'과목 · 2부 '+s.p+'쪽~</div>'+s.h+
 '<div class="nav"><button class="btn ghost" '+(i?'':'disabled')+' data-go="'+(i-1)+'">◀ 이전 학교</button><button class="btn ghost" '+(i<X.new.length-1?'':'disabled')+' data-go="'+(i+1)+'">다음 학교 ▶</button></div></article>';
 $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showNew(+b.dataset.go));top_();}
/* ---------- 사용 ---------- */
let FQ='',FC=false,FP='';
function sideUse(){
 $('#side').innerHTML='<div class="flt"><input id="q" placeholder="과목명·학교명 검색" value="'+esc(FQ)+'"><select id="fp"><option value="">전체 장</option>'+X.parts.map((p,k)=>'<option value="'+k+'"'+(FP===String(k)?' selected':'')+'>'+esc(p)+'</option>').join('')+'</select><label style="font-weight:400;font-size:13px;display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="fc" style="width:auto"'+(FC?' checked':'')+'> ◆조건부 승인(안) 포함 과목만</label></div><div class="cnt" id="cnt"></div><div id="ul"></div>';
 $('#q').oninput=e=>{FQ=e.target.value;listUse();};$('#fc').onchange=e=>{FC=e.target.checked;listUse();};$('#fp').onchange=e=>{FP=e.target.value;listUse();};
 listUse();showUse(CUR.use);}
function listUse(){const q=FQ.replace(/\s/g,'');let h='',cur=null,n=0;
 X.use.forEach((g,i)=>{if(FP!==''&&String(g.pt)!==FP)return;const c=g.r.filter(r=>r.c).length;if(FC&&!c)return;
  if(q&&!(g.n.replace(/\s/g,'').includes(q)||g.r.some(r=>r.s.replace(/\s/g,'').includes(q))))return;
  if(g.pt!==cur){cur=g.pt;h+='<h4>'+esc(X.parts[cur])+'</h4>';}n++;
  h+='<a href="#" data-i="'+i+'">'+String(g.no).padStart(3,'0')+' '+esc(g.n)+'<small>'+g.r.length+'건</small>'+(c?'<span class="cond">◆'+c+'</span>':'')+'</a>';});
 $('#ul').innerHTML=h||'<div class="cnt">결과 없음</div>';$('#cnt').textContent=n+'개 과목';
 $('#ul').querySelectorAll('a').forEach(a=>a.onclick=ev=>{ev.preventDefault();showUse(+a.dataset.i);});mark(CUR.use);}
function pdfBtns(f,name){return '<button type="button" class="btn pdfbtn" data-f="'+f.f+'" data-k="'+f.k+'" data-n="'+esc(name)+'.pdf" data-mode="open">PDF 열기 ('+f.np+'쪽, '+f.mb+'MB)</button> <button type="button" class="btn ghost pdfbtn" data-f="'+f.f+'" data-k="'+f.k+'" data-n="'+esc(name)+'.pdf" data-mode="save">내려받기</button>';}
function showUse(i){CUR.use=i;const g=X.use[i];mark(i);const c=g.r.filter(r=>r.c).length;
 let t='<div class="tbl"><table><thead><tr><th>신청교</th><th>편성</th><th>승인 시도</th><th>서면 검토</th><th>처리(안)</th><th>쪽</th></tr></thead><tbody>';
 g.r.forEach(r=>{t+='<tr'+(r.c?' class="c"':'')+'><td class="l">'+esc(r.s)+(r.rev?' <small style="color:#8a5a00">●수정본</small>':'')+'</td><td>'+esc(r.term)+'</td><td>'+esc(r.sido)+'</td><td>'+esc(r.j)+'</td><td>'+(r.c?'<b style="color:var(--warn)">◆조건부</b>':'승인')+'</td><td>'+r.p+'</td></tr>';});
 t+='</tbody></table></div>';
 let o='<ul class="ops">';g.r.forEach(r=>{o+='<li'+(r.c?' class="c"':'')+'><b>'+esc(r.s)+'</b> <span class="m">· 보완 항목: '+esc(r.x)+'</span><div>'+esc(r.op)+'</div>'+(r.c?'<div style="color:var(--warn);font-size:13px;margin-top:3px">◆ 조건부 승인(안) — 추가 자료 제출 조건: '+esc(r.why)+'</div>':'')+
  (X.pj[r.s]?'<div style="margin-top:6px">'+pjBtn(r.s)+'</div>':'')+'</li>';});o+='</ul>';
 $('#main').innerHTML='<article class="doc"><h2>'+String(g.no).padStart(3,'0')+'. '+esc(g.n)+'</h2><div class="tag">'+esc(X.parts[g.pt])+' · 신청 '+g.r.length+'건'+(c?' · <b style="color:var(--warn)">◆조건부 '+c+'건</b>':'')+' · 3부 '+g.p+'~'+g.pz+'쪽</div>'+
 '<h3>신청 학교</h3>'+t+'<h3>과목 심의 자료(3부 해당 부분)</h3><p style="font-size:13.5px;margin:0 0 8px">학교별 신청서·교재 개발 계획서·교육과정(안)(과목 간지 내용은 이 화면에 정리). 다른 학교 쪽에 1회만 실린 교육과정(안)은 뒤에 붙였습니다.</p>'+(g.f.np?pdfBtns(g.f,String(g.no).padStart(3,'0')+'_'+g.n):'<p class="cnt">수록 자료 없음</p>')+
 '<h3>학교별 서면 검토 의견</h3>'+o+
 '<div class="nav"><button class="btn ghost" data-go="-1">◀ 이전 과목</button><button class="btn ghost" data-go="1">다음 과목 ▶</button></div></article>';
 $('#main').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const vis=[...document.querySelectorAll('#ul a')].map(a=>+a.dataset.i);const k=vis.indexOf(i);const nx=vis[k+ +b.dataset.go];if(nx!==undefined)showUse(nx);});top_();}
function pjBtn(s){const f=X.pj[s];return '<button type="button" class="btn ghost pdfbtn" data-f="'+f.f+'" data-k="'+f.k+'" data-n="'+esc(s)+'_편제표.pdf" data-mode="open">'+esc(s.replace('고등학교','고').replace('중학교','중'))+' 편제표 열기 ('+f.p+'쪽~)</button>';}
function mark(i){document.querySelectorAll('#side a').forEach(a=>a.classList.toggle('on',+a.dataset.i===i));}
function top_(){if(window.innerWidth<860)$('#main').scrollIntoView({block:'start'});else window.scrollTo(0,0);}
/* ---------- PDF ---------- */
document.addEventListener('click',async ev=>{const b=ev.target.closest('.pdfbtn');if(!b)return;const save=b.dataset.mode==='save';const w=save?null:window.open('','_blank');
 const t=b.textContent;b.disabled=true;b.textContent='불러오는 중…';
 try{const r=await fetch(b.dataset.f,{cache:'no-store'});if(!r.ok)throw 0;const buf=new Uint8Array(await r.arrayBuffer());
  const k=await crypto.subtle.importKey('raw',u8(b.dataset.k),'AES-GCM',false,['decrypt']);const pdf=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},k,buf.slice(12));
  const url=URL.createObjectURL(new Blob([pdf],{type:'application/pdf'}));
  if(w){w.location.href=url}else{const a=document.createElement('a');a.href=url;a.download=b.dataset.n;document.body.appendChild(a);a.click();a.remove();}
  setTimeout(()=>URL.revokeObjectURL(url),600000);}
 catch(x){if(w)w.close();alert('PDF를 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.');}finally{b.disabled=false;b.textContent=t;}});
</script></body></html>
